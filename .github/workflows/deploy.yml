# 自动部署 h5/ 目录到 Cloudflare Pages（含 Functions 后端）
# 注意：必须进入 h5 目录后部署，确保 wrangler 识别 h5/functions 后端
name: Deploy H5 to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'h5/**'
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        working-directory: h5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy . --project-name=run-checkin --commit-dirty=true
